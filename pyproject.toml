[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[project]
name = "agent-kit"
version = "1.0.0"
description = "智能体工程学模板与同步工具：AGENT.md + .agents 体系的单一源头。"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "infinity_system: yin_bailiang" }
]
keywords = [
    "agent",
    "agent-engineering",
    "templates",
    "scaffolding",
    "developer-tools",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-kit = "agent_kit.cli:main"

[project.urls]
Homepage = "https://github.com/yinbailiang/agent_kit"
Repository = "https://github.com/yinbailiang/agent_kit"
Issues = "https://github.com/yinbailiang/agent_kit/issues"
Changelog = "https://github.com/yinbailiang/agent_kit/releases"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "agent-kit[test]",
    "interrogate",
    "pre-commit",
    "pyright",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle (errors)
    "F",   # pyflakes
    "I",   # isort
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle (warnings)
]
# 中文文案允许使用全角标点
allowed-confusables = ["，", "。", "、", "：", "；", "（", "）", "！", "？", "「", "」", "“", "”", "—", "→"]

[tool.ruff.lint.isort]
known-first-party = ["agent_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.interrogate]
fail-under = 90
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = ["tests"]

[tool.uv.build-backend]
module-root = "src"
module-name = "agent_kit"
